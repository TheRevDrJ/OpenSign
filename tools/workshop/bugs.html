<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSign tracker</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- THE TRACKER. `docs/bugs.json` is the one source, read through /__bugs off disk on every
     request by tools/serve.mjs — never copied, so the page cannot go stale in the server.
     ⛔ READ-ONLY, with no write path to grow one from: triage is a judgment, and filing
     goes through the developer. The look is FirstLight's bench, deliberately — same chrome, same
     status colours, so moving between two trackers costs nothing. -->
<style>
  @font-face { font-family:'Orbitron'; font-weight:700; src:url('/fonts/orbitron-latin-700-normal.woff2') format('woff2'); font-display:swap; }
  /* ⭐ THE READING FACE IS THE SYSTEM UI STACK; Orbitron stays on the CHROME only —
     the title, the bar, the tabs. This bench is READ, not looked at. */
  body { background:#04050c; color:#dfe9ff; margin:0; padding:28px 20px 60px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         font-size:16.5px; -webkit-font-smoothing:antialiased; }
  h1 { font-family:'Orbitron',Verdana,sans-serif; font-size:20px; letter-spacing:6px; color:#ffd75c; text-align:center; margin:8px 0 2px; }
  p.sub { text-align:center; color:#8093b8; font-size:14.5px; margin:0 0 12px; }
  p.sub b { color:#5f7099; }
  .key { text-align:center; color:#5f7099; font-size:12.5px; letter-spacing:1px; margin:0 0 4px; }
  .key i { font-style:normal; color:#ffc966; }

  .bar { position:sticky; top:0; background:#04050cee; padding:11px 0; text-align:center; z-index:5;
         border-bottom:1px solid #16203c; font-size:14px; letter-spacing:3px;
         font-family:'Orbitron',Verdana,sans-serif; }
  .bar .gsub { display:block; font-family:inherit; letter-spacing:1px; font-size:13px; color:#5f7099; margin-top:5px; }

  .tabs { max-width:1000px; margin:20px auto 12px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tab { font-family:'Orbitron',Verdana,sans-serif; font-size:12px; letter-spacing:3px;
         background:#070a16; color:#8093b8; border:1px solid #1c2748; border-radius:99px;
         padding:9px 20px; cursor:pointer; }
  .tab:hover { border-color:#3a4d80; color:#b9c9ea; }
  .tab.on { color:#04050c; background:#ffd75c; border-color:#ffd75c; }
  .tab .n { font-family:inherit; font-size:11.5px; opacity:.6; margin-left:7px; }

  .wheres { max-width:1000px; margin:0 auto 14px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .chip { --c:#8093b8; font-size:11.5px; letter-spacing:2px; font-family:'Orbitron',Verdana,sans-serif;
          background:transparent; color:#5f7099; border:1px solid #16203c; border-radius:99px;
          padding:5px 13px; cursor:pointer; }
  .chip:hover { border-color:var(--c); color:var(--c); }
  .chip.on { color:#04050c; background:var(--c); border-color:var(--c); }
  .chip .n { font-size:9.5px; opacity:.65; margin-left:6px; }

  .q { display:block; max-width:1000px; margin:0 auto 14px; width:100%; box-sizing:border-box;
       background:#070a16; border:1px solid #1c2748; border-radius:10px; color:#dfe9ff;
       font-family:inherit; font-size:15px; padding:12px 14px; }
  .q:focus { outline:none; border-color:#3a4d80; }

  .bug { max-width:1000px; margin:0 auto 9px; background:#070a16; border:1px solid #1c2748;
         border-left:4px solid #24345c; border-radius:10px; overflow:hidden; }
  .bhead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:14px 24px; cursor:pointer; }
  .bhead:hover { background:#0b1024; }
  /* ⭐ THE ID IS A COLUMN, NOT A WORD, and the face is MONOSPACE so the digits are
     unambiguous and tabular — he mis-read two ids in one message on Orbitron.
     11ch is literally the widest id we can make, so the column is derived, not tuned. */
  .bid { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14.5px;
         letter-spacing:0; color:#ffc966; flex:none; min-width:11ch; }
  .btitle { font-size:16.5px; color:#c8d4ee; flex:1 1 320px; line-height:1.45; }
  .pill { font-size:12px; letter-spacing:1.2px; border:1px solid #1c2748; border-radius:99px;
          padding:2px 9px; white-space:nowrap; color:#8093b8; }
  .when { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; color:#4a5878; flex:none; }
  .bbody { display:none; padding:8px 24px 20px; font-size:16px; line-height:1.75; color:#a9b9dc;
           border-top:1px solid #131c36; }
  .bug.open .bbody { display:block; }
  .nline { padding:3px 0; }
  .nline.fix { color:#8fe0b4; }
  .nline b { color:#dfe9ff; }
  .empty { max-width:1000px; margin:0 auto; color:#5f7099; font-size:13px; text-align:center; padding:40px 0; }
  .fresh { opacity:0; transition:opacity .4s; color:#6ef2a0; margin-left:.6em; cursor:pointer; }
  .fresh.show { opacity:1; }
</style>
</head>
<body>
<h1>THE&nbsp; TRACKER</h1>
<p class="sub">docs/bugs.json, live off disk · <b>read-only — bugs go through the developer</b><span class="fresh" id="fresh" onclick="location.reload()">the file changed — reload</span></p>
<p class="key"><i>BUG</i> &nbsp;·&nbsp; <i>FEATURE</i> &nbsp;·&nbsp; <i>TOOL</i></p>
<div class="bar" id="tally"></div>
<div class="tabs" id="tabs"></div>
<div class="wheres" id="wheres"></div>
<input class="q" id="q" placeholder="search — id, title, notes">
<div id="root"></div>
<script type="module">
const STEP_COLOR   = { YES:"#6ef2a0", NO:"#ffa14a", NA:"#5f7099" };
const STATUS_COLOR = { OPEN:"#ff6b6b", "IN PROGRESS":"#ffa14a", FIXED:"#ffd75c",
  DEFERRED:"#8093b8", VERIFIED:"#6ef2a0", DECLINED:"#5f7099",
  "NOT REPRODUCIBLE":"#5f7099", "BY DESIGN":"#5f7099", UPSTREAM:"#c9a6ff", DUPLICATE:"#5f7099" };
// ⭐ Same logic as FirstLight's: the PRODUCT blue, the INFRASTRUCTURE violet, the
//   outward-facing green. Only the roster differs, because the projects differ.
const WHERE_COLOR  = { KIOSK:"#7fd1ff", ADMIN:"#7fd1ff", SCRIPTURE:"#6ef2a0", SERVER:"#c9a6ff", BUILD:"#c9a6ff" };
const GATE_STATUS  = ["OPEN", "IN PROGRESS", "FIXED"];

const el = (t, c, s) => { const n = document.createElement(t); if (c) n.className = c; if (s !== undefined) n.textContent = s; return n; };
const pill = (text, color) => { const p = el("span", "pill", text); if (color) { p.style.color = color; p.style.borderColor = color; } return p; };
/** ⭐ NEWEST FIRST BY DATE. The id is identity, never ordering; id desc is the tiebreak
 *  inside one day so a day keeps a stable order. */
const byNewest = (a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id);

const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let T = null, tab = ls.get("os.bugs.tab") ?? "active", where = ls.get("os.bugs.where") ?? "ALL", needle = "";

function card(e) {
  const box = el("div", "bug");
  box.dataset.hay = [e.id, e.title, e.notes, e.where ?? "", e.status,
    e.verify ? `dev-${e.verify.dev} build-${e.verify.build}` : ""].join(" ").toLowerCase();
  box.style.borderLeftColor = STATUS_COLOR[e.status] ?? "#24345c";
  const head = el("div", "bhead");
  head.append(el("span", "bid", e.id));
  head.append(el("span", "btitle", e.title));
  head.append(pill(e.status, STATUS_COLOR[e.status]));
  if (e.blocking) head.append(pill("BLOCKING", "#ff6b6b"));
  if (e.where) head.append(pill(e.where, WHERE_COLOR[e.where]));
  if (e.dupeOf) head.append(pill(`dupe of ${e.dupeOf}`, "#5f7099"));
  if (e.verify) {
    head.append(pill(`dev ${e.verify.dev.toLowerCase()}`, STEP_COLOR[e.verify.dev]));
    head.append(pill(`build ${e.verify.build.toLowerCase()}`, STEP_COLOR[e.verify.build]));
  }
  if (e.date) head.append(el("span", "when", e.date));
  box.append(head);
  const body = el("div", "bbody");
  // one <div> per line, so the FIX line is styled without parsing the text
  for (const line of (e.notes || "—").split("\n")) {
    const d = el("div", /^\*\*FIX\.\*\*/.test(line) ? "nline fix" : "nline");
    d.innerHTML = line.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    body.append(d);
  }
  box.append(body);
  head.addEventListener("click", () => box.classList.toggle("open"));
  return box;
}

function draw() {
  const live = T.entries;
  const ACTIVE = live.filter(e => GATE_STATUS.includes(e.status));
  const DEFERRED = live.filter(e => e.status === "DEFERRED");
  const CLOSED = live.filter(e => !GATE_STATUS.includes(e.status) && e.status !== "DEFERRED");

  // the gate bar
  const blockers = ACTIVE.filter(e => e.blocking === true && e.kind !== "TOOL");
  const bar = document.getElementById("tally");
  /* the gate is SHIPPING: a release a church installs */
  bar.textContent = blockers.length ? `SHIP GATE: ${blockers.length} BLOCKING` : "SHIP GATE CLEAR";
  bar.style.color = blockers.length ? "#ff6b6b" : "#6ef2a0";
  const owed = ACTIVE.filter(e => e.verify?.build === "NO").length;
  bar.append(Object.assign(el("span", "gsub"),
    { textContent: `${blockers.length ? "" : "nothing blocking outstanding · "}${ACTIVE.length} active · ${DEFERRED.length} deferred · ${CLOSED.length} closed${owed ? ` · ${owed} awaiting proof on a display` : ""}` }));

  // tabs
  const counts = { active: ACTIVE.length, deferred: DEFERRED.length, closed: CLOSED.length };
  const tabs = document.getElementById("tabs"); tabs.replaceChildren();
  for (const [k, label] of [["active","ACTIVE"],["deferred","DEFERRED"],["closed","CLOSED"]]) {
    const b = el("button", "tab" + (tab === k ? " on" : ""), label);
    b.append(Object.assign(el("span", "n"), { textContent: counts[k] }));
    b.onclick = () => { tab = k; ls.set("os.bugs.tab", k); draw(); };
    tabs.append(b);
  }

  const source = tab === "active" ? ACTIVE : tab === "deferred" ? DEFERRED : CLOSED;

  // where chips, counted within the current tab
  const roster = ["ALL", ...(T.where ?? [])];
  const wh = document.getElementById("wheres"); wh.replaceChildren();
  for (const w of roster) {
    const n = w === "ALL" ? source.length : source.filter(e => e.where === w).length;
    const b = el("button", "chip" + (where === w ? " on" : ""), w);
    if (w !== "ALL") b.style.setProperty("--c", WHERE_COLOR[w] ?? "#8093b8");
    b.append(Object.assign(el("span", "n"), { textContent: n }));
    b.onclick = () => { where = w; ls.set("os.bugs.where", w); draw(); };
    wh.append(b);
  }

  const root = document.getElementById("root"); root.replaceChildren();
  const list = source.filter(e => where === "ALL" || e.where === where).sort(byNewest);
  const shown = list.map(card).filter(c => !needle || c.dataset.hay.includes(needle));
  if (!shown.length) root.append(el("div", "empty", "nothing here"));
  else for (const c of shown) root.append(c);
}

document.getElementById("q").oninput = (ev) => { needle = ev.target.value.trim().toLowerCase(); draw(); };

try {
  T = await (await fetch("/__bugs", { cache: "no-store" })).json();
  draw();
} catch (e) {
  document.getElementById("root").append(el("div", "empty", "could not read the tracker: " + e.message));
}

// ⭐ The tracker is deliberately NOT watched (a full-reload would yank him out of whatever
//   bench is open), so nothing tells this page an entry landed. Poll the cheap stamp and
//   OFFER a reload rather than taking one.
let stamp = null;
setInterval(async () => {
  try {
    const s = await (await fetch("/__bugs-stamp", { cache: "no-store" })).json();
    const now = `${s.m}:${s.s}`;
    if (stamp && now !== stamp) document.getElementById("fresh").classList.add("show");
    stamp = now;
  } catch { /* the server going away is not news */ }
}, 4000);
</script>
</body>
</html>
