<!doctype html>
<!-- The workshop launcher for OpenSign. It lives at the ROOT (6102/) on purpose: the page whose job
     is telling you what is up must not itself be the thing that needs a path. Adding a bench =
     one <a class="tool"> here and a file under tools/workshop/. Same chrome as the other
     workshops, so moving between them costs nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenSign workshop</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @font-face { font-family:'Orbitron'; font-weight:700; src:url('/fonts/orbitron-latin-700-normal.woff2') format('woff2'); font-display:swap; }
  body { background:#04050c; color:#dfe9ff; margin:0; padding:34px 20px 60px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; font-size:16.5px;
         -webkit-font-smoothing:antialiased; }
  h1 { font-family:'Orbitron',Verdana,sans-serif; font-size:20px; letter-spacing:6px; color:#ffd75c; text-align:center; margin:8px 0 2px; }
  p.sub { text-align:center; color:#8093b8; font-size:14.5px; margin:0 0 26px; }
  p.sub b { color:#5f7099; }
  .tools { max-width:1000px; margin:0 auto; display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  a.tool { display:block; background:#070a16; border:1px solid #1c2748; border-left:4px solid #ffd75c;
           border-radius:10px; padding:18px 22px; text-decoration:none; color:inherit; }
  a.tool:hover { background:#0b1024; border-color:#3a4d80; border-left-color:#ffd75c; }
  a.tool b { display:block; font-family:'Orbitron',Verdana,sans-serif; font-size:13px; letter-spacing:3px; color:#ffc966; margin-bottom:8px; }
  a.tool span { color:#8093b8; font-size:14.5px; line-height:1.55; }
  .links { max-width:1000px; margin:26px auto 0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .links a { font-family:'Orbitron',Verdana,sans-serif; font-size:11.5px; letter-spacing:2px; color:#5f7099;
             text-decoration:none; border:1px solid #16203c; border-radius:99px; padding:7px 15px; }
  .links a:hover { border-color:#3a4d80; color:#b9c9ea; }
  footer { text-align:center; color:#4a5878; font-size:12.5px; margin-top:34px; }
</style>
</head>
<body>
<h1>THE&nbsp; WORKSHOP</h1>
<p class="sub">OpenSign &middot; port 6102 &middot; <b>read-only &mdash; the benches never write</b></p>
<div class="tools">
  <a class="tool" href="/workshop/bugs.html">
    <b>TRACKER</b>
    <span>Bugs, features and tool notes, live off <code>docs/bugs.json</code>. Filing goes through the developer.</span>
  </a>
</div>
<div class="links">
  <a href="http://localhost:6100/" target="_blank" rel="noreferrer">THE KIOSK &rarr; 6100</a>
  <a href="http://localhost:6100/admin" target="_blank" rel="noreferrer">ADMIN &rarr; 6100/ADMIN</a>
</div>
<footer>It reads the repo and shows it.</footer>
</body>
</html>
